# Production stack: pgvector-capable Postgres + the app.
# This image carries the vector extension, so dense embeddings + pgvector
# (Phase 2 retrieval upgrade) need no database rebuild later.
# Required: a .env file beside this compose file (see .env.example) with at
# minimum DATABASE_URL, AUTH_SECRET, POSTGRES_PASSWORD.
# Start: docker compose up -d --build
# AI stays mock-first: add AI_API_KEY + AI_PROVIDER=openai to go live.

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: cultural_attire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Compose default; override in .env for real deployments.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/cultural_attire}
      STORAGE_DIR: /app/storage
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - appstorage:/app/storage
      - appbackups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  appstorage:
  appbackups:
